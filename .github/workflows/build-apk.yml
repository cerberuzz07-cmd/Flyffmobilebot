name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q FlyffMobileBot.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle -p FlyffMobileBot assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FlyffMobileBot-apk
          path: FlyffMobileBot/app/build/outputs/apk/debug/*.apk
